[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpuenvelope"
version = "0.1.0"
description = "Safe-operating-envelope finder + wedge-recovery ladder for serving local LLMs on a single consumer GPU."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Trent Milam" }]
dependencies = [
    "numpy>=1.24,<3",
]

[tool.setuptools.packages.find]
include = ["gpuenvelope*"]

[tool.setuptools.package-data]
gpuenvelope = ["data/*.csv"]
